<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Profiling System</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Our CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- HEADER -->

    <header class="bg-primary text-white py-4">

        <div class="container text-center">

            <h1 class="fw-bold">
                Student Profiling System
            </h1>

            <p class="mb-0">
                Student Academic Personal &amp; Career Profiling System
            </p>

        </div>

    </header>


    <!-- MAIN -->

    <main class="container py-5">

        <div class="row justify-content-center g-4">

            <!-- FACULTY -->

            <div class="col-md-5">

                <div class="card shadow-sm h-100">

                    <div class="card-body text-center p-5">

                        <div class="display-3 mb-3">
                            👩‍🏫
                        </div>

                        <h3 class="fw-bold">
                            Faculty
                        </h3>

                        <p class="text-muted">
                            Faculty members can access and manage
                            student profiles.
                        </p>

                        <a
                            href="faculty-login.html"
                            class="btn btn-primary w-100">

                            Faculty Login

                        </a>

                    </div>

                </div>

            </div>


            <!-- STUDENT -->

            <div class="col-md-5">

                <div class="card shadow-sm h-100">

                    <div class="card-body text-center p-5">

                        <div class="display-3 mb-3">
                            🎓
                        </div>

                        <h3 class="fw-bold">
                            Student
                        </h3>

                        <p class="text-muted">
                            Students can view and manage
                            their profile information.
                        </p>

                        <a
                            href="student-login.html"
                            class="btn btn-success w-100">

                            Student Login

                        </a>

                    </div>

                </div>

            </div>

        </div>

    </main>


    <!-- FOOTER -->

    <footer class="bg-light text-center py-3 mt-5">

        <p class="mb-0 text-muted">
            Student Profiling System
        </p>

    </footer>

</body>

</html>
