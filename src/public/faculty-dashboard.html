<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Faculty Dashboard - Student Profiling System</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<header class="bg-primary text-white py-4">
    <div class="container">
        <div class="d-flex justify-content-between align-items-center">

            <div>
                <h1 class="fw-bold mb-1">
                    Faculty Dashboard
                </h1>

                <p class="mb-0">
                    Student Academic Personal & Career Profiling System
                </p>
            </div>

            <a href="/" class="btn btn-light">
                Home
            </a>

        </div>
    </div>
</header>


<main class="container py-5">

    <!-- Summary Cards -->

    <div class="row g-4 mb-5">

        <div class="col-md-4">
            <div class="card shadow-sm text-center">
                <div class="card-body">
                    <h6 class="text-muted">Total Students</h6>
                    <h2 id="totalStudents" class="fw-bold text-primary">
                        0
                    </h2>
                </div>
            </div>
        </div>


        <div class="col-md-4">
            <div class="card shadow-sm text-center">
                <div class="card-body">
                    <h6 class="text-muted">Hostellers</h6>
                    <h2 id="hostellers" class="fw-bold text-success">
                        0
                    </h2>
                </div>
            </div>
        </div>


        <div class="col-md-4">
            <div class="card shadow-sm text-center">
                <div class="card-body">
                    <h6 class="text-muted">Day Scholars</h6>
                    <h2 id="dayScholars" class="fw-bold text-warning">
                        0
                    </h2>
                </div>
            </div>
        </div>

    </div>


    <!-- Search and Filters -->

    <div class="card shadow-sm mb-4">

        <div class="card-header bg-primary text-white">
            <h5 class="mb-0">
                Search & Filter Students
            </h5>
        </div>

        <div class="card-body">

            <div class="row g-3">

                <!-- Search -->

                <div class="col-md-4">

                    <label class="form-label">
                        Search
                    </label>

                    <input
                        type="text"
                        id="searchInput"
                        class="form-control"
                        placeholder="Register number or student name"
                    >

                </div>


                <!-- Category -->

                <div class="col-md-2">

                    <label class="form-label">
                        Category
                    </label>

                    <select id="categoryFilter" class="form-select">

                        <option value="All">
                            All
                        </option>

                        <option value="Hosteller">
                            Hosteller
                        </option>

                        <option value="Day Scholar">
                            Day Scholar
                        </option>

                    </select>

                </div>


                <!-- Career -->

                <div class="col-md-2">

                    <label class="form-label">
                        Career Goal
                    </label>

                    <select id="careerFilter" class="form-select">

                        <option value="All">
                            All
                        </option>

                        <option value="Placement">
                            Placement
                        </option>

                        <option value="Higher Studies">
                            Higher Studies
                        </option>

                        <option value="Entrepreneurship">
                            Entrepreneurship
                        </option>

                    </select>

                </div>


                <!-- Arrear -->

                <div class="col-md-2">

                    <label class="form-label">
                        Arrear Status
                    </label>

                    <select id="arrearFilter" class="form-select">

                        <option value="All">
                            All
                        </option>

                        <option value="Arrear">
                            Has Arrear
                        </option>

                        <option value="No Arrear">
                            No Arrear
                        </option>

                    </select>

                </div>


                <!-- CGPA -->

                <div class="col-md-2">

                    <label class="form-label">
                        CGPA
                    </label>

                    <select id="cgpaSort" class="form-select">

                        <option value="None">
                            Default
                        </option>

                        <option value="High">
                            Highest
                        </option>

                        <option value="Low">
                            Lowest
                        </option>

                    </select>

                </div>

            </div>


            <div class="text-end mt-3">

                <button
                    id="clearFilters"
                    class="btn btn-outline-secondary"
                >
                    Clear Filters
                </button>

            </div>

        </div>

    </div>


    <!-- Student Table -->

    <div class="card shadow-sm">

        <div class="card-header bg-primary text-white">

            <div class="d-flex justify-content-between align-items-center">

                <h5 class="mb-0">
                    Student Profiles
                </h5>

                <span id="resultCount" class="badge bg-light text-dark">
                    0 Students
                </span>

            </div>

        </div>


        <div class="card-body">

            <div class="table-responsive">

                <table class="table table-bordered table-hover align-middle">

                    <thead class="table-light">

                        <tr>

                            <th>S.No</th>

                            <th>Register Number</th>

                            <th>Name</th>

                            <th>Department</th>

                            <th>Section</th>

                            <th>Category</th>

                            <th>Career Goal</th>

                            <th>CGPA</th>

                            <th>Arrear</th>

                            <th>Actions</th>

                        </tr>

                    </thead>


                    <tbody id="studentTableBody">

                        <tr>

                            <td
                                colspan="10"
                                class="text-center"
                            >
                                Loading student records...
                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</main>


<script src="/js/faculty-dashboard.js"></script>

</body>

</html>
